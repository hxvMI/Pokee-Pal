# Verify pushes to main and pull requests with a clean dependency installation,
# server tests, frontend lint, and a production build using the root check script.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server
      - name: Test, lint, and build
        run: npm run check
