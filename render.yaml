# Deploy the API and built React frontend as one Render service.
# Secret values are supplied in Render; the build script places client assets under Express.

services:
  - type: web
    name: pokee-pal
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CACHE_ENABLED
        value: "false"
